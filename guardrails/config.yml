# NVIDIA NeMo Guardrails config for Mandate (checked in for judges).
# This preview does NOT run nemoguardrails on Vercel — Mandate's spending gate
# (POST /api/v1/pay) is the hard lock. These rails are the LLM I/O layer that
# complements the gate when an agent proposes payments in natural language.
# Optional local: pip install nemoguardrails && nemoguardrails chat --config=guardrails
# Apache-2.0 NeMo Guardrails: https://github.com/NVIDIA-NeMo/Guardrails
# Honesty: not a TEE, not a broadcast, not a substitute for evaluatePolicy.

models:
  - type: main
    engine: openai
    model: gpt-4o-mini

rails:
  input:
    flows:
      - mandate check jailbreak ask
      - mandate block override fields
  output:
    flows:
      - self check output

config:
  # Documented patterns only — full LLM self-check needs an API key locally.
  # The free trip script (scripts/trip-input-rail.mjs) mirrors these without Python.
